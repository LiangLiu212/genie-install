# Read-only package trees of the DUNE CVMFS Spack instance, reused as upstreams by the
# local install tree (spack-config/config.yaml, generated by scripts/setup_deps.sh).
# The instance's own site scope already lists v1.1.1; this adds the v1.2.2 tree.
upstreams:
  dune-v1-2-2:
    install_tree: /cvmfs/dune.opensciencegrid.org/spack/packages
